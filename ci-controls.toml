# Planted controls for witness CI checks, run by pulseengine/plant in the CI
# job each control names in `check` (.github/workflows/ci.yml). Each control
# runs its check on a copy of HEAD (must pass) and on a copy with the plant
# overlaid (must fail). Locally: `plant` from the repository root, with rivet
# on PATH and WITNESS set to an absolute witness binary path.

[[control]]
id = "rivet-broken-link"
check = "Rivet validate"
run = "rivet validate"
plant = "ci-controls/rivet-broken-link"
expect = "fail"
stderr_or_stdout_matches = 'REQ-PLANTED-BROKEN-LINK.*AS-DOES-NOT-EXIST'
timeout = 300

[[control]]
id = "report-schema-extra-property"
check = "Report schemas (fixtures)"
run = "python3 tools/check_report_schemas.py tests/fixtures/report-schema"
plant = "ci-controls/report-schema-extra-property"
expect = "fail"
stderr_or_stdout_matches = "'planted_undeclared_field' was unexpected"
timeout = 120

# #358 (v0.47.0 Bet 3a): the value-tail probe's condition index perturbed by
# one. The planted triangle report.json is what witness produced when
# `apply_unobserved_tails` inserted the probe one index early (as c2 instead
# of c3); the truth-table check must reject it. Runs in the "Verdict suite"
# job against that job's evidence (VERDICT_EVIDENCE); the planted copy
# replaces only triangle's report. Fails closed when the evidence is missing.
[[control]]
id = "truth-table-tail-index-shift"
check = "Verdict suite — end-to-end MC/DC on the canonical 7"
run = 'ev="${VERDICT_EVIDENCE:?set VERDICT_EVIDENCE to the verdict-suite output dir}" && test -f "$ev/triangle/report.json" && mkdir -p build && cp -R "$ev" build/ev && if [ -d planted-evidence ]; then cp -R planted-evidence/. build/ev/; fi && python3 tools/check_truth_tables.py --evidence build/ev'
plant = "ci-controls/truth-table-tail-index-shift"
expect = "fail"
stderr_or_stdout_matches = 'NEW DIVERGENCE \(not in ledger\): triangle: '

# witness recheck (FEAT-045), run in the "Recheck controls" job. Each control
# plants one tampering into the committed bundle tests/fixtures/recheck/suite
# and requires `witness recheck` to fail with that tampering's own failure
# class. WITNESS must name a built witness binary (absolute path). The
# expected signer key lives outside the bundle. Rebuild fixture and plants
# with tests/fixtures/recheck/regen.sh.

[[control]]
id = "recheck-deleted-run-json"
check = "Recheck controls"
run = '"$WITNESS" recheck tests/fixtures/recheck/suite --expect-key tests/fixtures/recheck/expected-signer.pub'
plant = "ci-controls/recheck-deleted-run-json"
expect = "fail"
stderr_or_stdout_matches = 'FAIL +state_machine/run\.json +\[required-file-missing\]'
timeout = 120

[[control]]
id = "recheck-flipped-module-byte"
check = "Recheck controls"
run = '"$WITNESS" recheck tests/fixtures/recheck/suite --expect-key tests/fixtures/recheck/expected-signer.pub'
plant = "ci-controls/recheck-flipped-module-byte"
expect = "fail"
stderr_or_stdout_matches = '\[inventory-digest-mismatch\] state_machine/instrumented\.wasm: content hashes to'
timeout = 120

# Hashes and inventory re-computed after the edit: the only check left to
# catch it is re-derivation of report.json from run.json, so the control
# requires that to be the single failure.
[[control]]
id = "recheck-gap-edited-to-proved"
check = "Recheck controls"
run = '"$WITNESS" recheck tests/fixtures/recheck/suite --expect-key tests/fixtures/recheck/expected-signer.pub'
plant = "ci-controls/recheck-gap-edited-to-proved"
expect = "fail"
stderr_or_stdout_matches = '(?m)FAIL +state_machine/rederive-report +\[rederive-mismatch\][\s\S]*, 1 failed, \d+ not checked, \d+ not applicable; failure classes: rederive-mismatch$'
timeout = 120

[[control]]
id = "recheck-inventory-absent-file"
check = "Recheck controls"
run = '"$WITNESS" recheck tests/fixtures/recheck/suite --expect-key tests/fixtures/recheck/expected-signer.pub'
plant = "ci-controls/recheck-inventory-absent-file"
expect = "fail"
stderr_or_stdout_matches = '\[inventory-missing-file\] INVENTORY\.sha256 lists state_machine/coverage-addendum\.json, which is not in the bundle'
timeout = 120

# Re-signed with a fresh key, the in-bundle verifying-key.pub and inventory
# updated to match: only the check against the expected key (from outside
# the bundle) can catch it.
[[control]]
id = "recheck-resigned-fresh-key"
check = "Recheck controls"
run = '"$WITNESS" recheck tests/fixtures/recheck/suite --expect-key tests/fixtures/recheck/expected-signer.pub'
plant = "ci-controls/recheck-resigned-fresh-key"
expect = "fail"
stderr_or_stdout_matches = '(?m)FAIL +state_machine/signature +\[signer-mismatch\][\s\S]*, 1 failed, \d+ not checked, \d+ not applicable; failure classes: signer-mismatch$'
timeout = 120

# predicate.json edited after signing (the envelope still verifies, inventory
# re-computed): with an expected key, the predicate links use the signed
# statement, so the only failure is predicate.json vs the signed payload.
[[control]]
id = "recheck-predicate-differs-from-signed"
check = "Recheck controls"
run = '"$WITNESS" recheck tests/fixtures/recheck/suite --expect-key tests/fixtures/recheck/expected-signer.pub'
plant = "ci-controls/recheck-predicate-differs-from-signed"
expect = "fail"
stderr_or_stdout_matches = '(?m)FAIL +state_machine/chain/predicate->envelope +\[envelope-payload-mismatch\][\s\S]*, 1 failed, \d+ not checked, \d+ not applicable; failure classes: envelope-payload-mismatch$'
timeout = 120

# One run.json row outcome flipped, report.json re-derived from the edited
# run record, inventory re-computed: only the signed measurement.run_sha256
# binds the run record, so that link is the single failure.
[[control]]
id = "recheck-run-edited-report-rederived"
check = "Recheck controls"
run = '"$WITNESS" recheck tests/fixtures/recheck/suite --expect-key tests/fixtures/recheck/expected-signer.pub'
plant = "ci-controls/recheck-run-edited-report-rederived"
expect = "fail"
stderr_or_stdout_matches = '(?m)FAIL +state_machine/chain/run->predicate +\[chain-mismatch\] sha256\(run\.json\)[\s\S]*, 1 failed, \d+ not checked, \d+ not applicable; failure classes: chain-mismatch$'
timeout = 120
