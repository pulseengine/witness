# Track B of the org release-artifact standard: crates.io publishing
# happens from CI via OIDC trusted publishing — never a hand-run
# `cargo publish` with a laptop token (the v0.44.0 cut stalled a month
# on exactly that: an expired local token).
#
# One-time setup per crate on crates.io (Settings → Trusted
# Publishing): repository pulseengine/witness, workflow file
# publish-to-crates-io.yml, no environment. Until that's configured,
# rust-lang/crates-io-auth-action fails loudly — nothing publishes.
#
# Publish order is dependency order; the four crates and the
# viz-from-its-own-workspace quirk are load-bearing:
#   witness-mcdc-checker -> witness-mcdc-core -> witness-mcdc
#   -> witness-mcdc-viz (own workspace at crates/witness-viz).
# Already-published versions are skipped, so a partial earlier publish
# (or a re-run) is safe.
name: Publish to crates.io

# Manual backfill only. The normal publish is the `publish-crates-io` job
# in release.yml (witness#361): crates.io Trusted Publishing rejects the
# `workflow_run` trigger this file used after #307, so that path could
# never publish. Dispatch this only for a tag whose Release run passed
# verification.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (back)publish, e.g. v0.44.0"
        required: true
        type: string

permissions:
  contents: read
  # OIDC exchange for the temporary crates.io token
  id-token: write

concurrency:
  group: crates-io-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate the tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: '$TAG'"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}

      # Pinned to commit SHAs: this job holds id-token: write and a crates.io
      # publish token, so a moved tag must not be able to swap the code.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Authenticate to crates.io (OIDC trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish_one() {
            # $1 = working dir, remaining args passed to cargo publish.
            local dir="$1"; shift
            local out
            if out=$( (cd "$dir" && cargo publish --locked "$@") 2>&1 ); then
              echo "$out" | tail -2
            elif echo "$out" | grep -qiE 'already (uploaded|exists)|crate version .* is already'; then
              echo "::notice::$* — version already on crates.io, skipping"
            else
              echo "$out"
              return 1
            fi
          }
          publish_one . -p witness-mcdc-checker
          publish_one . -p witness-mcdc-core
          publish_one . -p witness-mcdc
          # witness-viz is its own standalone workspace — publish from
          # its directory, not with -p from the root.
          publish_one crates/witness-viz
