# Track B of the org release-artifact standard: crates.io publishing
# happens from CI via OIDC trusted publishing — never a hand-run
# `cargo publish` with a laptop token (the v0.44.0 cut stalled a month
# on exactly that: an expired local token).
#
# One-time setup per crate on crates.io (Settings → Trusted
# Publishing): repository pulseengine/witness, workflow file
# publish-to-crates-io.yml, no environment. Until that's configured,
# rust-lang/crates-io-auth-action fails loudly — nothing publishes.
#
# Publish order is dependency order; the four crates and the
# viz-from-its-own-workspace quirk are load-bearing:
#   witness-mcdc-checker -> witness-mcdc-core -> witness-mcdc
#   -> witness-mcdc-viz (own workspace at crates/witness-viz).
# Already-published versions are skipped, so a partial earlier publish
# (or a re-run) is safe.
name: Publish to crates.io

# Runs only after the Release workflow SUCCEEDS for a tag push: a failing
# release (e.g. the full verification suite at the tag) must not leave an
# irreversible crates.io publish behind. The manual backfill path stays.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (back)publish, e.g. v0.44.0"
        required: true
        type: string

permissions:
  contents: read
  # OIDC exchange for the temporary crates.io token
  id-token: write

concurrency:
  group: crates-io-${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate the tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="${DISPATCH_TAG:-$RUN_TAG}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: '$TAG'"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Publish the exact commit the Release run built and signed.
          echo "ref=${RUN_SHA:-$TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Tag must point at the commit Release built
        if: github.event_name == 'workflow_run'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA=$(git rev-parse "${TAG}^{commit}")
          if [ "$TAG_SHA" != "$RUN_SHA" ]; then
            echo "::error::tag $TAG is $TAG_SHA but Release built $RUN_SHA"; exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (OIDC trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish_one() {
            # $1 = working dir, remaining args passed to cargo publish.
            local dir="$1"; shift
            local out
            if out=$( (cd "$dir" && cargo publish --locked "$@") 2>&1 ); then
              echo "$out" | tail -2
            elif echo "$out" | grep -qiE 'already (uploaded|exists)|crate version .* is already'; then
              echo "::notice::$* — version already on crates.io, skipping"
            else
              echo "$out"
              return 1
            fi
          }
          publish_one . -p witness-mcdc-checker
          publish_one . -p witness-mcdc-core
          publish_one . -p witness-mcdc
          # witness-viz is its own standalone workspace — publish from
          # its directory, not with -p from the root.
          publish_one crates/witness-viz
