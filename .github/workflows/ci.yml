name: CI

# Cancel superseded PR runs; never cancel main, scheduled, or dispatched
# runs. Group by workflow + branch (head_ref on PRs, ref otherwise) so
# distinct workflows on the same branch don't fight each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned (not @stable) so a moving stable can't surface rustfmt
      # diffs a developer's stable never saw. Bump deliberately, in
      # lockstep with the clippy job. NOT a repo-wide rust-toolchain.toml
      # (that would also override the MSRV + wasm-target jobs).
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # witness#327: the artifact graph is gated. `rivet validate` fails on a
  # broken link, an unknown type or a malformed artifact. The plant step runs
  # ci-controls.toml, which overlays ci-controls/rivet-broken-link/ (an artifact
  # linking to an id that does not exist) onto a copy of HEAD and requires
  # `rivet validate` to pass on the copy and fail on the planted copy, so this
  # check is shown to be able to fail. rivet is pinned to v0.38.0, the version
  # the control was measured with; the Verification Gate keeps its own pin.
  rivet-validate:
    name: Rivet validate
    # Same fail-closed routing as Format: fork PRs go to GitHub-hosted runners
    # (plant executes the manifest's run commands).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      RIVET_REV: a9ca696643dde6299fa54cd9fd430ab66ec6ed03 # rivet v0.38.0
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Job-local install root, cached by rev: smithy runners share ~/.cargo
      # across jobs and repos, so a rivet there can be any version.
      - name: Cache rivet binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rivet-root
          key: rivet-${{ runner.os }}-${{ env.RIVET_REV }}
      - name: Install rivet at the pinned rev (job-local)
        run: |
          root="$RUNNER_TEMP/rivet-root"
          if [ ! -x "$root/bin/rivet" ]; then
            cargo install --locked --git https://github.com/pulseengine/rivet \
              --rev "$RIVET_REV" --root "$root" --bin rivet rivet-cli
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/rivet" --version | grep -q "${RIVET_REV:0:8}" || { echo "::error::rivet is not at $RIVET_REV"; exit 1; }
      - name: Check rivet on PATH is the pinned one
        run: |
          [ "$(command -v rivet)" = "$RUNNER_TEMP/rivet-root/bin/rivet" ] || { echo "::error::rivet resolves to $(command -v rivet)"; exit 1; }
      - name: rivet validate
        run: rivet validate
      - name: Planted broken artifact must fail rivet validate
        uses: pulseengine/plant@1cda8c9afe5c00a7d21d82ecb3729a813234c892 # pre-1.0, adds action.yml (plant#3)
        with:
          manifest: ci-controls.toml
          only: rivet-broken-link

  # The committed report fixture must validate against the schema it declares,
  # and a copy with one undeclared decision property must not (plant control
  # report-schema-extra-property). Runs on PRs; the main-only Schemas job
  # below applies the same checker to the verdict suite's real evidence.
  report-schema-fixtures:
    name: Report schemas (fixtures)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install jsonschema (venv)
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-venv"
          "$RUNNER_TEMP/schema-venv/bin/python" -m pip install --quiet jsonschema
          echo "$RUNNER_TEMP/schema-venv/bin" >> "$GITHUB_PATH"
      - name: Fixture validates against its declared schema
        run: python3 tools/check_report_schemas.py tests/fixtures/report-schema
      - name: Planted undeclared property must fail validation
        uses: pulseengine/plant@1cda8c9afe5c00a7d21d82ecb3729a813234c892 # pre-1.0, adds action.yml (plant#3)
        with:
          manifest: ci-controls.toml
          only: report-schema-extra-property

  # v0.45 — every job that ran on the self-hosted `rust-cpu` pool now runs
  # on GitHub-hosted ubuntu-latest, for the reason Miri moved in v0.29: the
  # pool is shared org-wide and was saturated for days (required checks sat
  # QUEUED 75+ min and were cancelled before getting a runner). The full
  # 58-case rivet suite was proven on ubuntu-latest before this move.
  # Trade: GitHub-hosted minutes.
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned (not @stable) so a moving stable can't surface NEW clippy
      # lints a developer's stable never saw — the skew that bit v0.32.
      # Bump deliberately, in lockstep with the fmt job.
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          # Stays on ubuntu-latest equivalents: smithy is Linux x86_64 only.
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all-targets --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets --locked

  miri:
    name: Miri
    # v0.29 — moved off the self-hosted `lean-mem` pool to GitHub-hosted
    # ubuntu-latest. That pool was chronically saturated: Miri sat
    # QUEUED ~3h on five release PRs across v0.24.1–v0.28, each needing a
    # manual cancel/re-trigger or admin-merge. `timeout-minutes` bounds
    # RUN time but not QUEUE time, so the real fix is leaving the starved
    # pool. Miri here only interprets a handful of pure-Rust module tests
    # (report/decisions/predicate) — well within a hosted runner's 16 GB.
    # Trade: a few GitHub-hosted minutes per run.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run miri on the lib
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-tree-borrows"
        # Miri does not run wasmtime / walrus FFI cleanly; constrain
        # to the witness pure-Rust modules that benefit from UB
        # detection (decisions, error, report, predicate hex/SHA path).
        run: |
          cargo miri test --locked --lib report::
          cargo miri test --locked --lib decisions::
          cargo miri test --locked --lib predicate::tests::sha256_known_vector
          cargo miri test --locked --lib predicate::tests::rfc3339_format_is_well_formed

  deny:
    name: Cargo Deny
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Smithy workaround: EmbarkStudios/cargo-deny-action launches a
      # rootless container which fails under our hardened runner unit
      # (NoNewPrivileges=true blocks newuidmap). Run cargo-deny directly.
      # Skip `advisories` here — that check stays on the hosted `audit`
      # job until smithy ships cargo-audit 0.22.1+ (RUSTSEC-2026-0037
      # CVSS 4.0 parser issue).
      # Job-local install, called by path: smithy runners share ~/.cargo, and
      # runner8 held a job-installed cargo-deny there (smithy, 2026-11-18).
      # No `|| true`: a failed install fails the job instead of falling back
      # to whatever cargo-deny the runner has.
      - name: Install cargo-deny 0.16.4 (job-local)
        run: cargo install cargo-deny --locked --version 0.16.4 --root "$RUNNER_TEMP/cargo-deny"
      - run: |
          deny="$RUNNER_TEMP/cargo-deny/bin/cargo-deny"
          "$deny" --version | grep -qE '(^| )0\.16\.4$' || { echo "::error::cargo-deny is $("$deny" --version), want 0.16.4"; exit 1; }
          "$deny" check bans licenses sources

  audit:
    name: Security Audit
    # Light job on smithy (fork PRs stay on GitHub-hosted, same routing and
    # caveat as `fmt`). smithy's runners ship cargo-audit 0.22.2 since
    # 2026-11-08 (smithy ansible/group_vars/all.yml, meld#571), which parses
    # CVSS 4.0 advisories; the version check below fails the job if an older
    # cargo-audit is ever the one `cargo audit` resolves to.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Pinned: an unpinned install floats the advisory parser and audit
      # semantics under us (same pin policy as release.yml).
      # Installed into a job-local root and called by path: smithy runners
      # share ~/.cargo across jobs, and on runner8 (2026-11-18) its
      # .crates.toml recorded 0.22.2 while ~/.cargo/bin/cargo-audit was
      # 0.23.0, so `cargo install` skipped and `cargo audit` ran 0.23.0.
      - name: Install cargo-audit 0.22.2 (job-local)
        run: cargo install cargo-audit --locked --version 0.22.2 --root "$RUNNER_TEMP/cargo-audit"
      - name: Check cargo-audit version
        run: |
          audit="$RUNNER_TEMP/cargo-audit/bin/cargo-audit"
          "$audit" audit --version
          "$audit" audit --version | grep -qE '(^| )0\.22\.2$' \
            || { echo "::error::cargo-audit is $("$audit" audit --version), want 0.22.2"; exit 1; }
      # witness-viz and witness-component are standalone workspaces with
      # their own lockfiles that ship in releases; a bare `cargo audit`
      # only sees the root one. No ignore list exists (no audit.toml;
      # deny.toml `ignore = []`), so each run is a plain audit and any
      # vulnerability in any lockfile fails the job.
      - name: Audit all lockfiles
        run: |
          status=0
          for lock in Cargo.lock crates/witness-viz/Cargo.lock crates/witness-component/Cargo.lock; do
            echo "::group::cargo audit --file $lock"
            "$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file "$lock" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  proptest-extended:
    name: Proptest (extended cases)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --test properties --locked
        env:
          PROPTEST_CASES: "2048"

  mutants:
    name: Mutation testing (informational)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","lean-mem"]') || 'ubuntu-24.04' }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          cargo install cargo-mutants --locked
          cargo mutants --no-shuffle --timeout-multiplier 3 -j 2 || true

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    # Runs on PRs too, not only push-to-main. A coverage job that only runs
    # after a merge is an alarm, not a gate — it tells you coverage fell once
    # the fall is already on main. FreeRTOS's coverage-cop, the clearest public
    # example of a numeric structural-coverage gate, runs per pull request
    # (FreeRTOS-Plus-TCP ci.yml: branch-coverage-min 99.8, line-coverage-min 99.9).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --lcov --output-path lcov.info --all-targets

      # Upload before the gate, and with `always()`, so a failing threshold
      # still publishes the data you need to see WHICH lines regressed.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: (always()) && github.event.pull_request.head.repo.fork != true
        with:
          files: lcov.info
          flags: rust-source
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # The ratchet. 79 against a measured 79.80%, which is what THIS command
      # reports on CI: 13295 lines, 2685 missed, over --all-targets.
      #
      # The first version of this gate used 80, calibrated from the Codecov API
      # figure of 80.92% (7021/8676 lines). It failed immediately, and correctly:
      # Codecov and `cargo llvm-cov report --all-targets` do not share a
      # denominator — 8676 lines against 13295, because --all-targets counts test
      # and example code the Codecov upload does not. Two honest numbers, not
      # comparable, and the threshold has to come from the instrument that
      # ENFORCES it, not from the dashboard that displays it.
      #
      # Same trap this repo documents elsewhere: a coverage percentage means
      # nothing without its denominator. SQLite excludes ALWAYS()/NEVER()
      # branches, FreeRTOS rebuilds without asserts, synth's MC/DC denominator is
      # dominated by wasi-libc. All disclosed, none comparable.
      #
      # This re-reports from the profile data the step above already produced;
      # verified that `report` reuses it rather than re-running the suite.
      #
      # The gate was negative-controlled before being wired in, on a fixture at
      # 66.67% line coverage:
      #     --fail-under-lines 99 -> exit 1
      #     --fail-under-lines 40 -> exit 0
      # It can go red. Raise the number when coverage rises; never lower it to
      # make a build pass.
      - name: Coverage must not regress below the ratchet
        run: cargo llvm-cov report --fail-under-lines 79

  dogfood:
    name: Dogfood — witness measures the fixture
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build witness binary
        run: cargo build --release --locked -p witness-mcdc
      - name: Build fixture wasm
        run: |
          chmod +x crates/witness/tests/fixtures/sample-rust-crate/build.sh
          cd crates/witness/tests/fixtures/sample-rust-crate
          ./build.sh
      - name: Instrument + run + emit LCOV
        run: |
          set -euo pipefail
          fixture="crates/witness/tests/fixtures/sample-rust-crate/sample.wasm"
          ./target/release/witness instrument "$fixture" \
            -o sample.instrumented.wasm
          ./target/release/witness run sample.instrumented.wasm \
            --invoke run_then_arm \
            --invoke run_else_arm \
            --invoke run_brif_taken \
            --invoke run_brif_not_taken \
            --invoke run_match_arm_0 \
            --invoke run_match_arm_1 \
            --invoke run_match_default \
            --output witness-run.json
          ./target/release/witness lcov \
            --run witness-run.json \
            --manifest sample.instrumented.wasm.witness.json \
            -o wasm-bytecode.lcov.info \
            --overview witness-overview.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-bytecode-coverage
          path: |
            wasm-bytecode.lcov.info
            witness-overview.txt
            witness-run.json
            sample.instrumented.wasm.witness.json
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: wasm-bytecode.lcov.info
          flags: wasm-bytecode
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  wasm-component:
    name: Build witness-component (Component Model wasm) — v0.7.0+
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build witness-component (wasm32-wasip2)
        working-directory: crates/witness-component
        run: cargo build --release --locked --target wasm32-wasip2
      - name: Inspect emitted component
        run: |
          set -euo pipefail
          # wasm-tools is widely available as a binary; install via cargo
          # if the runner doesn't have it. Quick because release cache.
          cargo install wasm-tools --quiet || true
          wasm-tools validate crates/witness-component/target/wasm32-wasip2/release/witness_component.wasm
          wasm-tools component wit crates/witness-component/target/wasm32-wasip2/release/witness_component.wasm | head -25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-component-wasm
          path: crates/witness-component/target/wasm32-wasip2/release/witness_component.wasm
          if-no-files-found: warn

  schemas:
    name: Schemas — validate verdict evidence against shipped JSON Schema docs
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    # v0.10.0 item 5 — published schemas live at docs/schemas/. CI proves
    # the verdict suite's report.json / predicate.json files match the
    # schema each declares. Gating since 2026-11-18: it was
    # continue-on-error, which hid a v3 schema drift on every main run
    # (#384). A failure here turns main's CI run red.
    needs: verdict-suite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install jsonschema
        # The runner's system Python is externally managed (PEP 668), so a
        # bare `pip install` fails and this job never validated anything.
        # Install into a venv and put it first on PATH for later steps.
        # Falls back to --break-system-packages where the venv module
        # (Debian's python3-venv) isn't installed on the runner.
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/schemas-venv"
          if python3 -m venv "$V" 2>/dev/null; then
            "$V/bin/python" -m pip install jsonschema --quiet
            echo "$V/bin" >> "$GITHUB_PATH"
            "$V/bin/python" -m jsonschema --version
          else
            python3 -m pip install --user --break-system-packages jsonschema --quiet
            python3 -m jsonschema --version
          fi
      - name: Download verdict evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict-evidence
          path: build/verdict-evidence
      # Each file is validated against the schema it declares (`schema` for
      # report.json, `predicateType` for predicate.json), not a fixed v1:
      # the verdict suite emits witness-mcdc/v3.
      - name: Validate report.json and predicate.json against their declared schemas
        run: python3 tools/check_report_schemas.py build/verdict-evidence

  verdict-suite:
    name: Verdict suite — end-to-end MC/DC on the canonical 7
    runs-on: ubuntu-24.04
    # Runs on PRs too: as a main-only job it sat red on main for two weeks
    # (Oct 3–15 2026) with no PR ever showing it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v0.47.0 Bet 3a ledger rule: the known-divergence ledger may hold at
      # most 13 entries on any PR (13 at b041995). It may shrink freely.
      - name: Ledger rule — at most 13 truth-table divergence entries
        run: |
          n=$(jq '.divergences | length' verdicts/TRUTH-TABLE-DIVERGENCES.json)
          if [ "$n" -gt 13 ]; then
            echo "LEDGER RULE: verdicts/TRUTH-TABLE-DIVERGENCES.json has $n entries; at most 13 allowed" >&2
            exit 1
          fi
          echo "ok: ledger has $n entr(y/ies), limit 13"
      # Pinned to 1.98.1: rustc 1.99 lowers triangle/state_guard's
      # short-circuit decisions to branch-free i32.or/i32.and arithmetic,
      # so witness finds 0 branches and the gate below fails. Bumping the
      # pin needs witness to measure branch-free-lowered decisions, or at
      # least report them (REQ-079), and the gate list re-checked.
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build witness binary
        run: cargo build --release --locked -p witness-mcdc
      - name: Run verdict suite
        run: |
          chmod +x verdicts/run-suite.sh
          ./verdicts/run-suite.sh build/verdict-evidence
      - name: Check MC/DC reports against the truth tables (self-test, then evidence)
        run: |
          set -euo pipefail
          python3 tools/check_truth_tables.py --self-test
          python3 tools/check_truth_tables.py --evidence build/verdict-evidence
      # #358: the check must go red when the value-tail probe's condition
      # index is off by one (plant control truth-table-tail-index-shift).
      - name: Planted off-by-one tail probe must fail the truth-table check
        uses: pulseengine/plant@1cda8c9afe5c00a7d21d82ecb3729a813234c892 # pre-1.0, adds action.yml (plant#3)
        env:
          VERDICT_EVIDENCE: ${{ github.workspace }}/build/verdict-evidence
        with:
          manifest: ci-controls.toml
          only: truth-table-tail-index-shift
      - name: Regression gate — verdicts that should produce decisions
        run: |
          set -euo pipefail
          # These verdicts must produce non-empty decisions for v0.6.2+ to
          # be considered green. The two zero-decision verdicts
          # (range_overlap, mixed_or_and) get fully optimised to bitwise
          # arithmetic by rustc and are intentionally not in this gate.
          # v0.7.0 added httparse — expected to produce 50+ decisions
          # across the parser + inlined stdlib. The exact count varies
          # with rustc version so the gate just asserts >= 30.
          for v in leap_year triangle state_guard safety_envelope parser_dispatch nom_numbers state_machine json_lite; do
            n=$(python3 -c "import json; print(len(json.load(open('build/verdict-evidence/$v/run.json'))['decisions']))")
            if [ "$n" -lt 1 ]; then
              echo "REGRESSION: $v has 0 decisions; expected >= 1" >&2
              exit 1
            fi
            echo "ok: $v has $n decision(s)"
          done
          h=$(python3 -c "import json; print(len(json.load(open('build/verdict-evidence/httparse/run.json'))['decisions']))" 2>/dev/null || echo 0)
          if [ "$h" -lt 30 ]; then
            echo "REGRESSION: httparse has $h decisions; expected >= 30" >&2
            exit 1
          fi
          echo "ok: httparse has $h decision(s)"
          # v0.7.5: also gate on the proved-condition count. Below this floor
          # is a regression in either decisions reconstruction or pair-finding.
          p=$(python3 -c "import json; print(json.load(open('build/verdict-evidence/httparse/report.json'))['overall']['conditions_proved'])" 2>/dev/null || echo 0)
          if [ "$p" -lt 20 ]; then
            echo "REGRESSION: httparse has $p proved conditions; expected >= 20" >&2
            exit 1
          fi
          echo "ok: httparse has $p proved condition(s)"
      # FEAT-045: the inventory is written before the evidence is archived;
      # the Recheck controls job re-hashes every file against it after download.
      - name: Write the evidence inventory (INVENTORY.sha256)
        run: target/release/witness recheck --write-inventory build/verdict-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict-evidence
          path: build/verdict-evidence/

  # FEAT-045 (v0.47 bet 1): `witness recheck` on the verdict-suite evidence
  # (inventory written by the Verdict suite job before upload, re-hashed here
  # after download; every report.json re-derived from its run.json), then five
  # planted tamperings of the committed bundle tests/fixtures/recheck/suite,
  # each of which must fail recheck with its own failure class (ci-controls.toml,
  # recheck-*). Not a required check; making it one is the owner's decision.
  recheck-controls:
    name: Recheck controls
    runs-on: ubuntu-24.04
    needs: verdict-suite
    timeout-minutes: 30
    env:
      # plant is built with `cargo install`; the workflow's -D warnings is for
      # witness's own code, not for the pinned plant source.
      RUSTFLAGS: ""
      WITNESS: ${{ github.workspace }}/target/release/witness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build witness binary
        run: cargo build --release --locked -p witness-mcdc
      - name: Download verdict evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict-evidence
          path: build/verdict-evidence
      - name: Recheck the verdict-suite evidence (must pass)
        run: |
          set -euo pipefail
          "$WITNESS" recheck build/verdict-evidence
          "$WITNESS" recheck build/verdict-evidence --format json > "$RUNNER_TEMP/recheck.json"
          # A missing inventory or a skipped re-derivation is NOT-CHECKED, which
          # does not fail recheck; this job requires both to have run.
          jq -e '.ok
            and any(.checks[]; .id == "inventory" and .status == "pass")
            and ([.checks[] | select(.id | endswith("/rederive-report"))] | length > 0)
            and all(.checks[] | select(.id | endswith("/rederive-report")); .status == "pass")' \
            "$RUNNER_TEMP/recheck.json"
      - name: Recheck the committed fixture against the expected key (must pass)
        run: '"$WITNESS" recheck tests/fixtures/recheck/suite --expect-key tests/fixtures/recheck/expected-signer.pub'
      - name: Planted tamperings must each fail recheck
        uses: pulseengine/plant@1cda8c9afe5c00a7d21d82ecb3729a813234c892 # pre-1.0, adds action.yml (plant#3)
        with:
          manifest: ci-controls.toml
          only: recheck-deleted-run-json recheck-flipped-module-byte recheck-gap-edited-to-proved recheck-inventory-absent-file recheck-resigned-fresh-key
