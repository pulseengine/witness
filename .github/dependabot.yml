version: 2
# Grouped monthly updates (fleet template, owner decision 2026-11-21; template
# from rivet's .github/dependabot.yml). One entry per ecosystem, its
# directories in one `directories:` list, so a release opens one PR and not
# one per directory. Every entry runs monthly (the 1st, 02:00 UTC), keeps at
# most 2 PRs open, and waits 7 days after a release (cooldown). Lockstep
# groups come first because Dependabot puts a dependency in the FIRST group it
# matches; then one minor-patch group. Majors stay ungrouped, one PR each, so
# a breaking change is read on its own. Security updates ignore the schedule
# and the limit.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      # Every dtolnay/rust-toolchain step pins master df2a88e9 and names its
      # Rust toolchain in `toolchain:` (1.100.0, 1.97.0 for fmt/clippy/MSRV,
      # 1.98.1 for the verdict suite, a dated nightly for Miri). Dependabot
      # once bumped the old version-branch refs to a nonexistent Rust version
      # and broke every job at toolchain install (#129, #132). The action pin
      # and the toolchains move by hand, in lockstep.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/witness-component
      - /crates/witness-core
      - /crates/witness-mcdc-checker
      - /crates/witness-viz
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # wasmtime + wasmtime-wasi MUST move together: a lone bump of one
      # (wasmtime-wasi 46 while wasmtime stayed 45, #140) is an incompatible
      # pair that breaks the build and needs a code migration.
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directories:
      - /tests/playwright
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
